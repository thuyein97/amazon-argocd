name: gitops-validate

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

  k8s-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap structural validation: make sure YAML parses cleanly.
      # For full validation you'd add kubeconform/kubeval + CRD schemas.
      - name: Parse YAML files
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          root = Path(".")
          bad = []
          for p in root.rglob("*.yml"):
            try:
              list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
            except Exception as e:
              bad.append((str(p), str(e)))
          for p in root.rglob("*.yaml"):
            try:
              list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
            except Exception as e:
              bad.append((str(p), str(e)))
          if bad:
            for p, e in bad:
              print(f"YAML parse failed: {p}\n  {e}\n", file=sys.stderr)
            raise SystemExit(1)
          print("All YAML files parsed successfully.")
          PY

