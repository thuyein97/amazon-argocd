apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bankapp-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/thuyein97/amazon-argocd.git
    targetRevision: main
    path: apps/bankapp-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
